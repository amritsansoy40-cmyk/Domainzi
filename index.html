<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Marketplace</title>
    <!-- CSS file ko yahan link karte hain -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h1>Art & Second-Hand Marketplace</h1>
        <button onclick="openLoginModal()">Login with OTP</button>
    </nav>

    <div class="container">
        <!-- Item Form -->
        <div class="card">
            <h2>Apni Cheez ya Drawing Bechein</h2>
            <form id="productForm">
                <input type="text" id="title" placeholder="Title" required>
                <textarea id="description" placeholder="Description" required></textarea>
                <input type="number" id="price" placeholder="Price (₹)" required>
                <select id="category">
                    <option value="drawing">Drawing / Artwork</option>
                    <option value="second-hand">Second-Hand Item</option>
                </select>
                <input type="text" id="image" placeholder="Image URL" required>
                <input type="text" id="sellerPhone" placeholder="Mobile Number" required>
                <button type="submit" class="btn-primary">List Item</button>
            </form>
        </div>

        <!-- Product Feed -->
        <div class="feed">
            <h2>Available Items</h2>
            <div id="productList" class="grid"></div>
        </div>
    </div>

    <!-- OTP Modal -->
    <div id="otpModal" class="modal hidden">
        <div class="modal-content">
            <h3>OTP Login</h3>
            <div id="phoneStep">
                <input type="text" id="phoneInput" placeholder="Mobile Number">
                <button onclick="sendOTP()" class="btn-green">Send OTP</button>
            </div>
            <div id="verifyStep" class="hidden">
                <input type="text" id="otpInput" placeholder="Enter 4-digit OTP">
                <button onclick="verifyOTP()" class="btn-primary">Verify & Login</button>
            </div>
        </div>
    </div>

    <!-- JavaScript file ko yahan link karte hain -->
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domainzi</title>
    
    <!-- Agar CSS alag file mein hai toh link karein -->
    <link rel="stylesheet" href="style.css">

    <style>
      /* CSS Code aap yahan <style> ke andar bhi rakh sakte ho */
      .feed-container {
        max-width: 500px;
        margin: 20px auto;
        font-family: Arial, sans-serif;
      }
      .create-post textarea {
        width: 100%;
        height: 60px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }
      .create-post button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 5px;
      }
      .post-card {
        background: #f9f9f9;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        margin-top: 15px;
      }
      .like-btn {
        background: transparent;
        border: none;
        font-size: 18px;
        cursor: pointer;
      }
    </style>
</head>
<body>

    <!-- Domainzi Feed UI -->
    <div class="feed-container">
      <h2>Domainzi Feed 🚀</h2>
      
      <!-- Post Banane Ka Box -->
      <div class="create-post">
        <textarea id="postInput" placeholder="Aaj aapne kya naya banaya? Yahan share karein..."></textarea>
        <button onclick="addPost()">Post Karein</button>
      </div>

      <!-- Feed Posts Yahan Dikhnegi -->
      <div id="postsList"></div>
    </div>

    <!-- JavaScript Logic -->
    <script>
      function addPost() {
        const postText = document.getElementById("postInput").value;
        if (!postText) return alert("Kuch likho toh sahi!");

        const postsList = document.getElementById("postsList");
        
        const postCard = document.createElement("div");
        postCard.className = "post-card";
        postCard.innerHTML = `
          <p><strong>@artist_user:</strong> ${postText}</p>
          <button class="like-btn" onclick="likePost(this)">❤️ <span>0</span> Likes</button>
        `;

        postsList.prepend(postCard);
        document.getElementById("postInput").value = "";
      }

      function likePost(button) {
        let countSpan = button.querySelector("span");
        let currentLikes = parseInt(countSpan.innerText);
        countSpan.innerText = currentLikes + 1;
      }
    </script>
</body>
</html><!DOCTYPE html>
